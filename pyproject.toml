[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "1.0.0"
description = "An inspectable policy and evaluation boundary for agent tool calls"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "PyYAML>=6,<7", "jinja2>=3.1.6,<4", "jsonschema>=4.23,<5", "httpx>=0.28,<1", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "coverage>=7,<8", "types-PyYAML", "types-jsonschema", "httpx2>=2.13,<3"]
mcp = ["mcp>=1.9,<2"]

[project.scripts]
agentgate = "agentgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentgate", "demo", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "S105", "S106", "S110", "S311"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.hatch.build.targets.wheel.force-include]
"policies/demo.yml" = "agentgate/policies/demo.yml"
