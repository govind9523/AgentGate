services:
  agentgate:
    build: .
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      AGENTGATE_ENV: production
      AGENTGATE_PUBLIC_DEMO: "true"
      AGENTGATE_DEV_MODE: "false"
      AGENTGATE_DATABASE_URL: sqlite:////app/data/agentgate.db
      AGENTGATE_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    volumes:
      - agentgate-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  agentgate-data:
